:root{--pink:#f792b6;--pink2:#ffdce8;--lav:#b39ddb;--lav2:#efe8fb;--lav3:#d3c5f3;--sun:#ffe59a;--ink:#4f3d87;--bg:#fffafa;--card:#fff}
*{box-sizing:border-box;margin:0}
body{font-family:Fredoka,'Trebuchet MS',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;background-image:radial-gradient(var(--pink2) 2px,transparent 2px);background-size:26px 26px}

button,input,select,textarea{font:inherit;color:inherit}

.ic{vertical-align:-4px;flex:none}

nav{display:flex;gap:4px;flex:1;flex-wrap:wrap}
nav a{padding:4px 12px;border-radius:99px;font-weight:500;border:2px solid transparent}
nav a:hover{background:var(--lav2)}
nav a.on{background:var(--sun);border-color:var(--ink)}
.cb{background:var(--pink);border:3px solid var(--ink);border-radius:99px;padding:2px 14px;font-weight:700;box-shadow:3px 3px 0 var(--ink);color:#fff}
main{max-width:1000px;margin:auto;padding:22px 14px 50px}
h2{font-size:1.6rem;font-weight:700;margin:30px 0 12px}
.btn{display:inline-block;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:99px;padding:6px 22px;font-weight:600;cursor:pointer;box-shadow:4px 4px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--lav);}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;background:var(--lav2);border:3px solid var(--ink);border-radius:30px;padding:28px;box-shadow:6px 6px 0 var(--ink)}
.hero h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.1;font-weight:700}
.hero p{margin:10px 0 16px;font-size:1.1rem}
.hero .btn{margin:0 8px 8px 0}
.stack{position:relative;height:230px}
.stack div{position:absolute;inset:0;margin:auto;width:130px;height:180px;border:3px solid var(--ink);border-radius:18px;display:grid;place-items:center;font-size:3.4rem;font-weight:700;box-shadow:4px 4px 0 var(--ink)}
.stack div:nth-child(1){background:var(--sun);transform:rotate(-14deg) translateX(-60px)}
.stack div:nth-child(2){background:var(--lav3);transform:rotate(10deg) translateX(60px)}
.stack div:nth-child(3){background:var(--pink);color:#fff;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-12px) rotate(3deg)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px}
.pc{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 4px 0 var(--ink)}
.pc:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.pc img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--pink2);display:grid;place-items:center;color:var(--lav)}
.tag{font-size:.8rem;background:var(--lav2);border-radius:99px;padding:0 10px;align-self:flex-start}
.pr{font-weight:700;color:var(--pink);-webkit-text-stroke:.5px var(--ink)}
.so{position:absolute;top:8px;right:8px;background:var(--ink);color:#fff;border-radius:99px;padding:0 10px;font-size:.8rem;font-style:normal}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.steps div,.gift{background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px}
.steps b{display:block;font-size:1.15rem}.steps svg{color:var(--pink);margin-bottom:4px}
.gift{background:var(--sun);text-align:center;box-shadow:4px 4px 0 var(--ink);font-size:1.1rem}.gift .btn{display:block;width:fit-content;margin:12px auto 0}

.q{aspect-ratio:1;display:grid;place-items:center;font-size:3rem;font-weight:700;color:var(--lav)}
.rb{font-style:normal;font-size:.85rem;font-weight:700;color:var(--c)}
.r-common{--c:#8e9bc0}.r-rare{--c:#3b9bff}.r-epic{--c:#b05cff}.r-legendary{--c:#ffb000}

.empty{text-align:center;padding:40px 10px}.empty>svg{display:block;margin:0 auto;color:var(--lav)}.empty p{font-size:1.1rem;margin:6px 0 14px}.empty h2{margin:6px 0}

.box p{margin:6px 0 10px}
@keyframes pop{0%{transform:scale(.4) rotate(-8deg);opacity:0}70%{transform:scale(1.06)}}
.rv .glow{border:4px solid var(--c);border-radius:20px;padding:6px;margin-bottom:8px;color:var(--lav)}.rv img{width:100%;border-radius:14px;display:block}
#ts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--sun);border:3px solid var(--ink);border-radius:99px;padding:4px 20px;font-weight:600;display:none;max-width:92vw;text-align:center}
#ts.er{background:var(--pink);color:#fff}#ts.on{display:block}
footer{text-align:center;padding:20px;border-top:3px solid var(--ink);background:var(--card);font-weight:500}
footer svg{color:var(--pink);vertical-align:-3px}
html,body{overflow-x:hidden}
@media(max-width:640px){

.lg img{height:40px}
.cb{order:2;margin-left:auto}
nav{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding-bottom:4px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}

.hero p{font-size:1rem}

.it{position:relative}

.pvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.pvx{position:relative}.pvx img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);border-radius:12px;display:block}
.pvx .x{width:26px;height:26px;top:4px;right:4px}
.empty .cbx{justify-content:center}
.sp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:14px 10px;min-height:200px;background:var(--lav2);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);color:var(--ink)}
.sp:hover,.spb:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink)}
.spi{width:56px;height:56px;flex:none;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;color:var(--pink)}
.sp b{font-size:1.1rem;line-height:1.15}
.sp small{font-size:.85rem}
.sp em,.spb em{font-style:normal;font-weight:600;font-size:.85rem;background:var(--pink2);border:2px solid var(--ink);border-radius:99px;padding:0 12px;white-space:nowrap}
.spb{display:flex;align-items:center;gap:12px;margin-top:26px;padding:12px 14px;background:var(--lav2);border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink)}
.spb .spi{width:44px;height:44px}.spb div{flex:1}.spb b{display:block}.spb small{font-size:.85rem}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.opt{flex:1;min-width:110px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:6px 10px;cursor:pointer;text-align:center}
.opt.on{background:var(--pink2);box-shadow:3px 3px 0 var(--ink)}
.opt b{display:block}.opt small{font-size:.8rem}
.lbl{font-weight:600;margin-top:10px}
.pbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:6px 14px;margin:8px 0 10px;box-shadow:3px 3px 0 var(--ink);font-weight:600}
.pbox b{font-size:1.3rem}
.trk{display:flex;margin:14px 0 6px}
.trk div{flex:1;text-align:center;position:relative;font-size:.8rem;font-weight:500;color:#9c90c4}
.trk div::before{content:"";display:block;width:26px;height:26px;border-radius:50%;border:3px solid var(--ink);background:#fff;margin:0 auto 4px;position:relative;z-index:1}
.trk div::after{content:"";position:absolute;top:12px;left:-50%;width:100%;height:4px;background:#e1daf5;z-index:0}
.trk div:first-child::after{display:none}
.trk div.done{color:var(--ink)}
.trk div.done::before{background:var(--pink)}
.trk div.done::after{background:var(--pink)}
.trk div.cur::before{background:var(--sun);box-shadow:0 0 0 4px var(--lav3)}
.ocard{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.ocard ul{margin:6px 0 6px 20px}
</style>

/* Icons (stroke SVG, no emojis) */
const I={
 gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',

let P=[],busy=0,tt,mcb,fx=null,imgs=[],S={printed:0,drawn:0},sty='printed';

/* Loading + messages */
function toast(m,er){const t=$('#ts');t.textContent=m;t.className='on'+(er?' er':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',2800)}
async function run(fn,ok){busy++;$('#ld').classList.add('on');
 try{const r=await fn();if(ok)toast(ok);return r}
 catch(e){console.error(e);toast('Database problem: '+(e.code||e.message),1)}
 finally{if(!--busy)$('#ld').classList.remove('on')}}
function modal(h,cb){$('#mb').innerHTML=h;$('#md').classList.add('on');mcb=cb}

/* Cart + profile */
const getCart=()=>JSON.parse(localStorage.lw_cart||'[]');

const badge=()=>$('#cc').textContent=getCart().reduce((a,x)=>a+x.q,0);
const prof=()=>JSON.parse(localStorage.lw_prof||'null');

const loadScript=u=>new Promise((r,j)=>{const e=document.createElement('script');e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)});
async function needQR(){
 if(window.jsQR)return;
 for(const u of ['https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js','https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js']){
  try{await loadScript(u);if(window.jsQR)return}catch(e){}}
 throw {name:'NoLib'}}
function gotQR(t){const m=(t.split('#/open/')[1]||t).split(/[?&#]/)[0];stopCam();closeM(1);unlock(decodeURIComponent(m))}
async function scan(){
 modal(`${xb}<h3>Scan QR code</h3><div id="cm"><p>Starting the camera...</p></div><label class="file">${ic('image')} Take or choose a photo of the QR<input type="file" accept="image/*" capture="environment" hidden onchange="scanFile(this)"></label><br><button class="btn alt" onclick="closeM(1);manual()">${ic('key',18)} Add code manually</button>`,stopCam);
 const cm=$('#cm');
 try{
  await needQR();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw {name:'NoHttps'};
  strm=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
  cm.innerHTML='<video id="vd" playsinline muted autoplay style="width:100%;border:3px solid var(--ink);border-radius:16px"></video><p>Point the camera at the QR code on your item.</p>';
  const v=$('#vd');v.srcObject=strm;await v.play();
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=()=>{if(!strm)return;
   if(v.videoWidth){cv.width=v.videoWidth;cv.height=v.videoHeight;cx.drawImage(v,0,0);
    const r=jsQR(cx.getImageData(0,0,cv.width,cv.height).data,cv.width,cv.height);
    if(r&&r.data){gotQR(r.data);return}}
   requestAnimationFrame(tick)};
  tick()
 }catch(e){
  stopCam();console.error(e);
  const m={NotAllowedError:'Camera permission is blocked. Allow the camera for this site in your browser settings, or use the photo option below.',NotFoundError:'No camera was found on this device.',NoHttps:'Live scanning needs a secure (https) page. Use the photo option below.',NoLib:'The QR reader could not load. Check your internet and try again, or use Add code manually.'}[e.name]||'Could not start the camera. Use the photo option below or Add code manually.';
  cm.innerHTML=`<p>${m}</p>`}}
async function scanFile(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 const t=await run(async()=>{
  await needQR();const u=URL.createObjectURL(f);
  const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=u});
  const sc=Math.min(1,1200/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
  const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);return r&&r.data});
 if(t)gotQR(t);else if(t!==undefined)toast('No QR code found in that photo. Try again, closer and steady.',1)}

const MAXC=900000;
const readURL=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});
async function toB64(f){
 let url=await readURL(f);
 if(f.size<=1048576&&url.length<MAXC)return url;
 const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(Error('Not a valid image'));i.src=url});
 let sc=Math.min(1,1600/Math.max(im.width,im.height)),q=.85;
 for(let n=0;n<14;n++){
  const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  url=c.toDataURL('image/jpeg',q);
  if(url.length<MAXC)return url;
  if(q>.55)q-=.1;else sc*=.8}
 throw Error('Image is too large to compress')}

/* Order tracking */
const STEPS=[['requested','Requested'],['confirmed','Confirmed'],['packaged','Packaged'],['delivered','Delivered']];
const stOf=v=>v==='new'||!v?'requested':v;
function track(){
 const pf=prof();
 app.innerHTML=`<h2>Track your order</h2><p>Enter the phone number you used when ordering.</p><div class="cbx"><input id="tp" type="tel" placeholder="Phone number" value="${esc(pf?pf.p:'')}" style="text-transform:none;letter-spacing:0"><button class="btn" onclick="doTrack()">Track</button></div><div id="tr"></div>`;
 if(pf)doTrack()}
async function doTrack(){
 const ph=$('#tp').value.replace(/\D/g,'');
 if(ph.length<10)return toast('Enter a valid phone number',1);
 const o=await run(async()=>(await getDocs(query(collection(db,'orders'),where('phone','==',ph)))).docs.map(d=>({id:d.id,...d.data()})));
 if(!o)return;
 o.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 $('#tr').innerHTML=o.length?o.map(x=>{
  const st=stOf(x.status),i=STEPS.findIndex(a=>a[0]===st);
  return `<div class="ocard"><b>Order #${x.id.slice(0,6).toUpperCase()}</b>${x.gift?' <span class="tag">Gift</span>':''}
  ${st==='cancelled'?'<p><b>This order was cancelled.</b></p>':`<div class="trk">${STEPS.map((a,k)=>`<div class="${k<=i?'done':''}${k===i?' cur':''}">${a[1]}</div>`).join('')}</div>`}
  <ul>${(x.lines||[]).map(l=>`<li>${l.q} x ${esc(l.name)}${l.style?` (${esc(l.style)})`:''}</li>`).join('')}</ul>
  <b>${x.custom&&!x.total?'Price to be confirmed':'Total: EGP '+x.total}</b> <small>${x.createdAt?new Date(x.createdAt.seconds*1000).toLocaleDateString():''}</small></div>`}).join(''):empty('bag','No orders found','We could not find orders for this phone number.')}
