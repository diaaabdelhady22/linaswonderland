<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Lina’s Wonderland</title>
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#f792b6;--pink2:#ffdce8;--lav:#b39ddb;--lav2:#efe8fb;--lav3:#d3c5f3;--sun:#ffe59a;--ink:#4f3d87;--bg:#fffafa}
*{box-sizing:border-box;margin:0}
body{font-family:Fredoka,'Trebuchet MS',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;background-image:radial-gradient(var(--pink2) 2px,transparent 2px);background-size:26px 26px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lav);outline-offset:2px}
.ic{vertical-align:-4px;flex:none}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:10px;padding:6px 14px;flex-wrap:wrap}
header img{height:44px;display:block}
header b{background:var(--ink);color:#fff;border-radius:99px;padding:0 12px}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
nav button{border:3px solid transparent;background:none;border-radius:99px;padding:2px 14px;cursor:pointer;font-weight:500}
nav button.on{background:var(--sun);border-color:var(--ink)}
main{max-width:900px;margin:auto;padding:16px 14px 50px}
h2{font-size:1.6rem;margin:18px 0 12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--ink);margin-bottom:16px}
.btn{display:inline-flex;gap:6px;align-items:center;background:var(--pink);color:#fff;border:3px solid var(--ink);border-radius:99px;padding:4px 18px;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:var(--lav)}
.ib{border:2px solid var(--ink);background:var(--lav2);border-radius:10px;padding:4px 8px;cursor:pointer}
input,select,textarea{width:100%;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;background:#fff;margin-bottom:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.file{display:inline-flex;gap:6px;align-items:center;border:3px dashed var(--ink);border-radius:14px;padding:6px 14px;cursor:pointer;margin-bottom:8px;background:var(--lav2)}
.pv{display:none;max-width:140px;border:3px solid var(--ink);border-radius:12px;margin:0 0 10px}
.row,.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px;margin-bottom:10px}
.row img,.row .ph{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none;background:var(--pink2);display:grid;place-items:center;color:var(--lav)}
.gr{flex:1;min-width:120px}.gr small{display:block}
.top{margin-bottom:6px}.top select{width:auto;margin:0}
.tag{font-size:.8rem;background:var(--sun);border-radius:99px;padding:0 10px;border:2px solid var(--ink)}
code{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:1.1rem;letter-spacing:2px;background:var(--lav2);border:2px solid var(--ink);border-radius:10px;padding:2px 10px;cursor:pointer}
.rb{font-weight:700;color:var(--c)}
.r-common{--c:#8e9bc0}.r-rare{--c:#3b9bff}.r-epic{--c:#b05cff}.r-legendary{--c:#e09a00}
ul{margin:4px 0 8px 20px}p{margin:4px 0}
#ld{position:fixed;inset:0;z-index:50;display:none;place-items:center;background:#4f3d8799}
#ld.on{display:grid}
#ld div{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:16px 26px;font-weight:600;text-align:center}
#ld i{display:block;width:40px;height:40px;margin:0 auto 6px;border:5px solid var(--pink2);border-top-color:var(--pink);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#ts{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:60;background:var(--sun);border:3px solid var(--ink);border-radius:99px;padding:4px 20px;font-weight:600;display:none;max-width:92vw;text-align:center}
#ts.er{background:var(--pink);color:#fff}#ts.on{display:block}
html,body{overflow-x:hidden}
@media(max-width:560px){
.two{grid-template-columns:1fr}
header{padding:6px 10px;gap:6px}header img{height:36px}
nav{flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;padding:2px 10px}
main{padding:12px 10px 40px}
h2{font-size:1.35rem}
.card{padding:12px}
.row{align-items:flex-start}
.row .gr{flex:1 1 calc(100% - 140px)}
code{font-size:.95rem;letter-spacing:1px}
.btn{padding:4px 14px}
}
.cq{display:flex;gap:8px;align-items:center}
.qr{width:84px;height:84px;border:2px solid var(--ink);border-radius:8px;flex:none}
.cq .ib{margin-top:4px}
.pvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0}
.pvs img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);border-radius:8px;display:block}
label{font-weight:500;display:block;margin:4px 0}
</style>
</head>
<body>
<header>
 <img src="logo.png" alt="Lina’s Wonderland" onerror="this.remove()"><b>Admin</b>
 <nav id="nv"></nav>
</header>
<main id="app"></main>
<div id="ld"><div><i></i>One moment, talking to the database</div></div>
<div id="ts"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,getDocs,getDoc,doc,addDoc,setDoc,updateDoc,deleteDoc,query,where,writeBatch,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyB6uXdwjpsI4T46WVc0dK3EgS5N5YO1FdI",
  authDomain:"kreaker-23074.firebaseapp.com",
  projectId:"kreaker-23074",
  storageBucket:"kreaker-23074.firebasestorage.app",
  messagingSenderId:"377533249082",
  appId:"1:377533249082:web:96d94ab75b9e685634e703"
};
const db=getFirestore(initializeApp(firebaseConfig));

const MAX_CHARS=900000;           // base64 length that keeps a Firestore doc safely under 1 MB
const ST=['requested','confirmed','packaged','delivered','cancelled'];
const stOf=s=>s==='new'||!s?'requested':s;
const RAR=['common','rare','epic','legendary'];
const CAT={bag:'Blind Bag',photo:'Laminated Photo',other:'Other'};

const I={
 trash:'<path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>',
 edit:'<path d="M17 3a2.8 2.8 0 0 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>',
 upload:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>',
 image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/>',
 pkg:'<path d="m7.5 4.3 9 5.2"/><path d="M21 8v8a2 2 0 0 1-1 1.7l-7 4a2 2 0 0 1-2 0l-7-4A2 2 0 0 1 3 16V8a2 2 0 0 1 1-1.7l7-4a2 2 0 0 1 2 0l7 4A2 2 0 0 1 21 8z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
 gift:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/>',
 bag:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
 copy:'<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>'
};
const ic=(n,s=18)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kb=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.round(n/1024)+' KB';
let P=[],cur='',img=null,busy=0,tt,cache=[];

function toast(m,er){const t=$('#ts');t.textContent=m;t.className='on'+(er?' er':'');clearTimeout(tt);tt=setTimeout(()=>t.className='',3000)}
async function run(fn,ok){busy++;$('#ld').classList.add('on');
 try{const r=await fn();if(ok)toast(ok);return r}
 catch(e){console.error(e);toast('Error: '+(e.code||e.message),1)}
 finally{if(!--busy)$('#ld').classList.remove('on')}}

/* ===== Image to base64, compressed when needed ===== */
const readURL=f=>new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsDataURL(f)});
async function toB64(f){
 let url=await readURL(f);
 if(f.size<=1048576&&url.length<MAX_CHARS)return url;          // small enough, upload as is
 const im=await new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>j(Error('Not a valid image'));i.src=url});
 let sc=Math.min(1,1600/Math.max(im.width,im.height)),q=.85;
 for(let n=0;n<14;n++){
  const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
  url=c.toDataURL('image/jpeg',q);
  if(url.length<MAX_CHARS)return url;
  if(q>.55)q-=.1;else sc*=.8}
 throw Error('Image is too large to compress')}
async function pick(inp){
 const f=inp.files[0];if(!f)return;
 const u=await run(()=>toB64(f));if(!u)return;
 img=u;const p=$('#pv');p.src=u;p.style.display='block';
 toast(`Image ready: ${kb(f.size)} to ${kb(u.length*.75)}`)}

/* ===== Navigation ===== */
const TABS=[['orders','Orders','pkg'],['products','Products','bag'],['items','Bag items','gift'],['prices','Special prices','plus']];
$('#nv').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" onclick="go('${t[0]}')">${ic(t[2])} ${t[1]}</button>`).join('');
function go(t){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));({orders,products,items,prices})[t]()}
const loadP=async()=>{P=(await run(async()=>(await getDocs(collection(db,'products'))).docs.map(d=>({id:d.id,...d.data()}))))||P;P.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0))};
const fileBox=`<label class="file">${ic('upload')} Choose image<input type="file" accept="image/*" hidden onchange="pick(this)"></label><img id="pv" class="pv" alt="">`;

/* ===== Orders ===== */
async function orders(){
 const o=await run(async()=>(await getDocs(collection(db,'orders'))).docs.map(d=>({id:d.id,...d.data()})));if(!o)return;
 o.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));
 app.innerHTML=`<h2>Orders (${o.length})</h2>${o.length?o.map(x=>`<div class="card"><div class="top"><b>#${x.id.slice(0,6).toUpperCase()}</b>${x.gift?'<span class="tag">Gift</span>':''}${x.custom?`<span class="tag">Custom ${x.custom}</span>`:''}<span class="gr"></span><select onchange="setSt('${x.id}',this.value)">${ST.map(s=>`<option ${s===stOf(x.status)?'selected':''}>${s}</option>`).join('')}</select><button class="ib" title="Delete" onclick="delO('${x.id}')">${ic('trash')}</button></div>
 <p>${esc(x.name)} | <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></p><p>${x.grade?`${esc(x.school||'')} | ${esc(x.grade)} | Class ${esc(x.cls)}`:esc(x.address)}</p>
 ${x.custom?`<p><b>${esc(x.title)}</b></p><p>${esc(x.desc)}</p><div class="pvs" id="im${x.id}"></div>`:''}${x.notes?`<p>Note: ${esc(x.notes)}</p>`:''}
 <ul>${(x.lines||[]).map(l=>`<li>${l.q} x ${esc(l.name)}${l.style?` (${esc(l.style)})`:''}</li>`).join('')}</ul><b>${x.custom&&!x.total?'Price to be confirmed':'Total: EGP '+x.total}</b> <small>${x.createdAt?new Date(x.createdAt.seconds*1000).toLocaleString():''}</small></div>`).join(''):'<p>No orders yet.</p>'}`;
 o.filter(x=>x.imageCount).forEach(loadImgs)}
async function loadImgs(x){
 try{const s=await getDocs(query(collection(db,'orderImages'),where('orderId','==',x.id)));
  const a=s.docs.map(d=>d.data()).sort((p,q)=>p.idx-q.idx),e=$('#im'+x.id);
  if(e)e.innerHTML=a.map((d,i)=>`<a href="${d.image}" download="${x.id.slice(0,6)}-${i+1}.jpg" title="Download"><img src="${d.image}" alt=""></a>`).join('')}catch(e){console.error(e)}}
const setSt=(id,s)=>run(()=>updateDoc(doc(db,'orders',id),{status:s}),'Status updated');
async function delO(id){
 if(!confirm('Delete this order?'))return;
 const ok=await run(async()=>{const s=await getDocs(query(collection(db,'orderImages'),where('orderId','==',id))),b=writeBatch(db);s.docs.forEach(d=>b.delete(d.ref));b.delete(doc(db,'orders',id));await b.commit();return 1},'Order deleted');
 if(ok)orders()}

/* ===== Products ===== */
async function products(){
 await loadP();img=null;
 app.innerHTML=`<h2>Products</h2><div class="card"><input type="hidden" id="pid"><input id="pname" placeholder="Name"><div class="two"><input id="pprice" type="number" min="0" placeholder="Price (EGP)"><input id="pstock" type="number" min="0" placeholder="Stock (empty = unlimited)"></div>
 <select id="pcat">${Object.entries(CAT).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</select>
 <label>Blind bag only: style prices (leave empty to use the main price)</label><div class="two"><input id="ppp" type="number" min="0" placeholder="Printed price (EGP)"><input id="ppd" type="number" min="0" placeholder="Drawn price (EGP)"></div><textarea id="pdesc" rows="3" placeholder="Description"></textarea>${fileBox}
 <div class="top"><button class="btn" onclick="saveP()">${ic('check')} Save product</button><button class="btn alt" onclick="products()">Clear</button></div></div>
 ${P.map(p=>`<div class="row">${p.image?`<img src="${p.image}" alt="">`:`<div class="ph">${ic('image',24)}</div>`}<div class="gr"><b>${esc(p.name)}</b><small>${CAT[p.category]||''} | EGP ${p.price}${p.category==='bag'&&(p.pricePrinted!=null||p.priceDrawn!=null)?` (Printed ${p.pricePrinted??p.price} / Drawn ${p.priceDrawn??p.price})`:''} | ${p.stock==null?'unlimited':p.stock+' in stock'}</small></div><button class="ib" title="Edit" onclick="editP('${p.id}')">${ic('edit')}</button><button class="ib" title="Delete" onclick="delP('${p.id}')">${ic('trash')}</button></div>`).join('')||'<p>No products yet.</p>'}`}
function editP(id){
 const p=P.find(x=>x.id===id);img=null;
 $('#pid').value=id;$('#pname').value=p.name||'';$('#pprice').value=p.price??'';$('#pstock').value=p.stock??'';$('#pcat').value=p.category||'bag';$('#ppp').value=p.pricePrinted??'';$('#ppd').value=p.priceDrawn??'';$('#pdesc').value=p.desc||'';
 if(p.image){const v=$('#pv');v.src=p.image;v.style.display='block'}
 scrollTo(0,0);toast('Editing. Choose a new image only if you want to replace it.')}
async function saveP(){
 const id=$('#pid').value,name=$('#pname').value.trim(),price=parseFloat($('#pprice').value),s=$('#pstock').value;
 if(!name||isNaN(price))return toast('Name and price are required',1);
 const pp=$('#ppp').value,pd=$('#ppd').value,isBag=$('#pcat').value==='bag';
 const d={name,price,category:$('#pcat').value,desc:$('#pdesc').value.trim(),stock:s===''?null:parseInt(s),pricePrinted:isBag&&pp!==''?parseFloat(pp):null,priceDrawn:isBag&&pd!==''?parseFloat(pd):null};
 if(img)d.image=img;
 const ok=await run(async()=>{id?await setDoc(doc(db,'products',id),d,{merge:true}):await addDoc(collection(db,'products'),{...d,createdAt:serverTimestamp()});return 1},'Product saved');
 if(ok)products()}
async function delP(id){if(confirm('Delete this product?')&&await run(()=>deleteDoc(doc(db,'products',id)).then(()=>1),'Product deleted'))products()}

/* ===== Bag items ===== */
const gen=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>a[x%a.length]).join('')};
const fmt=c=>c.slice(0,4)+'-'+c.slice(4);
async function items(){
 if(!P.length)await loadP();
 const bags=P.filter(p=>p.category==='bag');
 if(!bags.length){app.innerHTML='<h2>Bag items</h2><p>Add a blind bag in Products first.</p>';return}
 if(!bags.find(b=>b.id===cur))cur=bags[0].id;
 img=null;
 app.innerHTML=`<h2>Bag items</h2><select id="bsel" onchange="cur=this.value;items()">${bags.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><div id="ib"></div>`;
 $('#bsel').value=cur;
 const its=await run(async()=>{
  const s=await getDocs(query(collection(db,'items'),where('bagId','==',cur)));
  const a=s.docs.map(d=>({id:d.id,...d.data()}));
  await Promise.all(a.map(async i=>i.image=(await getDoc(doc(db,'itemImages',i.id))).data()?.image));return a});
 if(!its)return;
 its.sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));cache=its;
 $('#ib').innerHTML=`<div class="card"><input id="iname" placeholder="Item name"><div class="two"><select id="irar">${RAR.map(r=>`<option value="${r}">${r[0].toUpperCase()+r.slice(1)}</option>`).join('')}</select><select id="ityp"><option value="item">Item</option><option value="photo">Photo</option></select></div>${fileBox}
 <div><button class="btn" onclick="addI()">${ic('plus')} Add item and generate code</button></div></div>
 <div class="top"><b class="gr">${its.length} item${its.length===1?'':'s'}</b><button class="btn alt" onclick="copyAll()">${ic('copy')} Copy all codes</button><button class="btn alt" onclick="printAll()">${ic('image')} Print QR sheet</button></div>
 ${its.map(i=>`<div class="row">${i.image?`<img src="${i.image}" alt="">`:`<div class="ph">${ic('image',24)}</div>`}<div class="gr"><b>${esc(i.name)}</b><small class="r-${i.rarity}"><span class="rb">${i.rarity}</span> | ${i.type}</small></div><div class="cq"><img class="qr" src="${qrPng(link(i.code),6)}" alt="QR ${fmt(i.code)}"><div><code onclick="cp('${fmt(i.code)}')" title="Click to copy">${fmt(i.code)}</code><small>Opened by ${i.opens||0}</small><button class="ib" onclick="dlQR('${i.id}')">${ic('dl')} QR</button></div></div><button class="ib" title="Delete" onclick="delI('${i.id}')">${ic('trash')}</button></div>`).join('')}`}
async function addI(){
 const name=$('#iname').value.trim();
 if(!name||!img)return toast('Item name and image are required',1);
 const code=await run(async()=>{
  let c,t=0;
  do{c=gen();t++}while(t<10&&!(await getDocs(query(collection(db,'items'),where('code','==',c)))).empty);
  const ref=doc(collection(db,'items')),b=writeBatch(db);
  b.set(ref,{bagId:cur,name,rarity:$('#irar').value,type:$('#ityp').value,code:c,createdAt:serverTimestamp()});
  b.set(doc(db,'itemImages',ref.id),{image:img});
  await b.commit();return c});
 if(code){toast('Item added. Code: '+fmt(code));items()}}
async function delI(id){
 if(!confirm('Delete this item?'))return;
 const ok=await run(async()=>{const b=writeBatch(db);b.delete(doc(db,'items',id));b.delete(doc(db,'itemImages',id));await b.commit();return 1},'Item deleted');
 if(ok)items()}
const cp=t=>navigator.clipboard.writeText(t).then(()=>toast('Copied '+t),()=>toast('Copy failed',1));
const copyAll=()=>cp(cache.map(i=>`${fmt(i.code)}  ${i.name} (${i.rarity})`).join('\n'));

/* ===== Special blind bag prices ===== */
async function prices(){
 const d=await run(async()=>{const s=await getDoc(doc(db,'settings','prices'));return s.exists()?s.data():{}});if(!d)return;
 app.innerHTML=`<h2>Special blind bag prices</h2><div class="card"><p>These prices apply to every Create Your Special blind bag, depending on the style the customer picks. Ready-made blind bags keep their own product price.</p><label for="pp1">Printed (EGP)</label><input id="pp1" type="number" min="0" value="${d.printed??''}"><label for="pp2">Drawn (EGP)</label><input id="pp2" type="number" min="0" value="${d.drawn??''}"><button class="btn" onclick="savePrices()">${ic('check')} Save prices</button></div>`}
async function savePrices(){
 const a=parseFloat($('#pp1').value),b=parseFloat($('#pp2').value);
 if(isNaN(a)||isNaN(b)||a<0||b<0)return toast('Enter both prices',1);
 await run(()=>setDoc(doc(db,'settings','prices'),{printed:a,drawn:b}),'Prices saved')}

/* QR codes: each QR opens the store and unlocks the item */
const link=c=>location.origin+location.pathname.replace(/[^/]*$/,'')+'index.html#/open/'+c;
function qrPng(t,sz=8){
 const q=qrcode(0,'M');q.addData(t);q.make();
 const n=q.getModuleCount(),m=2,c=document.createElement('canvas');c.width=c.height=(n+2*m)*sz;
 const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#2d2057';
 for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+m)*sz,(r+m)*sz,sz,sz);
 return c.toDataURL('image/png')}
function dlQR(id){const i=cache.find(x=>x.id===id),a=document.createElement('a');a.href=qrPng(link(i.code),12);a.download=`${i.name}-${fmt(i.code)}.png`;a.click()}
function printAll(){
 const w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print',1);
 w.document.write(`<title>QR codes</title><style>body{font-family:sans-serif;display:flex;flex-wrap:wrap;gap:12px}div{width:170px;text-align:center;border:1px dashed #999;padding:8px;font-size:13px;break-inside:avoid}img{width:150px}</style>${cache.map(i=>`<div><img src="${qrPng(link(i.code),8)}"><br><b>${esc(i.name)}</b><br>${fmt(i.code)}</div>`).join('')}`);
 w.document.close();setTimeout(()=>w.print(),400)}
Object.assign(window,{savePrices,prices,go,pick,setSt,delO,saveP,editP,delP,addI,delI,cp,copyAll,products,items,orders,dlQR,printAll});
Object.defineProperty(window,'cur',{get:()=>cur,set:v=>cur=v});
go('orders');
</script>
